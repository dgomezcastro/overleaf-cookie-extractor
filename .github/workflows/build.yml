name: Build XPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  WEB_EXT: npx --yes web-ext@10.8.0

jobs:
  build:
    name: Lint and build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint
        run: $WEB_EXT lint

      - name: Build
        run: |
          $WEB_EXT build --overwrite-dest --ignore-files "README.md" "LICENSE"
          version=$(jq -r .version manifest.json)
          mv web-ext-artifacts/*.zip "web-ext-artifacts/overleaf-cookie-${version}-unsigned.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: overleaf-cookie-unsigned
          path: web-ext-artifacts/*.xpi

  release:
    name: Sign and release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi

      - name: Sign with addons.mozilla.org (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets."
            exit 1
          fi
          $WEB_EXT sign \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000 \
            --ignore-files "README.md" "LICENSE"
          version=$(jq -r .version manifest.json)
          mv web-ext-artifacts/*.xpi "web-ext-artifacts/overleaf-cookie-${version}.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: overleaf-cookie-signed
          path: web-ext-artifacts/*.xpi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.xpi \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
